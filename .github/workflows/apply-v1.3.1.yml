name: Apply FlyLab v1.3.1 payload

on:
  push:
    branches:
      - release-v1.3.1-grooming-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.3.1-grooming-fix

      - name: Reconstruct staged source files
        shell: bash
        run: |
          set -euo pipefail
          cat .release_v131/index-* > /tmp/index.html
          cat .release_v131/main-* > /tmp/main.js

          echo "index.html Git blob: $(git hash-object /tmp/index.html)"
          echo "src/main.js Git blob: $(git hash-object /tmp/main.js)"

          test "$(git hash-object /tmp/index.html)" = "5cf638949a46ff46dc8e828f78be066d0c31edee"
          test "$(git hash-object /tmp/main.js)" = "0fe67172c10d41c73627826fabeef77b13bc7c99"

          mv /tmp/index.html index.html
          mv /tmp/main.js src/main.js

      - name: Verify syntax and local MaleCNS mirror
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/models.js
          node --check src/body.js
          node --check src/corner.js
          node --check src/grooming.js
          node --check src/leg-ik.js
          grep -Fq "const DEFAULT_BASE='../../data/malecns/';" src/malecns/worker.js
          test -s data/malecns/graph.flyg
          test -s data/malecns/neurons.flyn
          test -s data/malecns/meta.json
          test -s data/malecns/bodymap.json

      - name: Test
        run: npm test

      - name: Clean staging and commit validated release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_v131
          rm -f .github/workflows/apply-v1.3.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: FlyLab v1.3.1 biomechanics and eye-safe grooming"
          git push
