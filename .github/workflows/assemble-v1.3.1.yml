name: Assemble FlyLab v1.3.1

on:
  push:
    branches:
      - release-v1.3.1-grooming-fix

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.3.1-grooming-fix

      - name: Reconstruct exact release files
        run: |
          cat .release_v131/main-* > /tmp/main.js
          cat .release_v131/models-* > /tmp/models.js
          cat .release_v131/index-* > /tmp/index.html
          echo "139493ecb4ba00c6e886b83db83fcc994ff8db2561880f59ef8f258e8b34f1fd  /tmp/main.js" | sha256sum -c -
          echo "69d2406799352c16784ccc01ce16b4c12c7ab2f168b0ea9e77586bb10dc92814  /tmp/models.js" | sha256sum -c -
          echo "cb45d107090a5dc927e9313421d1c788849b7fc7b5a4294fe803dbb0eaf9fd36  /tmp/index.html" | sha256sum -c -
          cp /tmp/main.js src/main.js
          cp /tmp/models.js src/models.js
          cp /tmp/index.html index.html
          rm -rf .release_v131
          rm -f .github/workflows/assemble-v1.3.1.yml

      - name: Verify JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/models.js
          node --check src/body.js
          node --check src/grooming.js
          node --check src/leg-ik.js
          node --check src/corner.js
          node --check src/footholds.js

      - name: Run full test suite
        run: npm test

      - name: Protect pinned local MaleCNS mirror
        run: |
          test -f data/malecns/graph.flyg
          test -f data/malecns/neurons.flyn
          test -f data/malecns/meta.json
          test -f data/malecns/bodymap.json
          grep -q "../../data/malecns/" src/malecns/worker.js

      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: FlyLab v1.3.1 biomechanics and eye-safe grooming"
          git push
