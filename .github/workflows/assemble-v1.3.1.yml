name: Assemble FlyLab v1.3.1

on:
  push:
    branches:
      - release-v1.3.1-grooming-fix

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.3.1-grooming-fix

      - name: Reconstruct exact release files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from itertools import combinations
          import hashlib

          root=Path('.release_v131')

          def sha(b):
              return hashlib.sha256(b).hexdigest()

          def reconstruct(prefix, target_sha, missing_newlines):
              paths=sorted(root.glob(prefix+'-*'))
              if not paths:
                  raise SystemExit(f'No chunks found for {prefix}')
              chunks=[p.read_bytes() for p in paths]
              raw=b''.join(chunks)
              print(prefix, 'chunks', len(chunks), 'raw bytes', len(raw), 'raw sha256', sha(raw))
              if sha(raw)==target_sha:
                  return raw
              # Text chunks were staged through a UTF-8 contents API. A few chunk-ending
              # newlines were stripped during staging. Repair only by inserting exactly the
              # known number of LF bytes, and accept a candidate only if it matches the
              # independently calculated SHA-256 of the locally validated release file.
              slots=range(len(chunks))  # after each chunk, including EOF after the last
              for chosen in combinations(slots, missing_newlines):
                  chosen=set(chosen)
                  out=bytearray()
                  for i,c in enumerate(chunks):
                      out.extend(c)
                      if i in chosen:
                          out.extend(b'\n')
                  out=bytes(out)
                  if sha(out)==target_sha:
                      print(prefix, 'verified repair: inserted LF after chunk(s)', sorted(chosen))
                      return out
              raise SystemExit(f'{prefix}: no reconstruction matches trusted SHA-256 {target_sha}')

          main=reconstruct('main','139493ecb4ba00c6e886b83db83fcc994ff8db2561880f59ef8f258e8b34f1fd',3)
          models=reconstruct('models','69d2406799352c16784ccc01ce16b4c12c7ab2f168b0ea9e77586bb10dc92814',1)
          index=reconstruct('index','cb45d107090a5dc927e9313421d1c788849b7fc7b5a4294fe803dbb0eaf9fd36',0)

          Path('src/main.js').write_bytes(main)
          Path('src/models.js').write_bytes(models)
          Path('index.html').write_bytes(index)
          PY

          echo "139493ecb4ba00c6e886b83db83fcc994ff8db2561880f59ef8f258e8b34f1fd  src/main.js" | sha256sum -c -
          echo "69d2406799352c16784ccc01ce16b4c12c7ab2f168b0ea9e77586bb10dc92814  src/models.js" | sha256sum -c -
          echo "cb45d107090a5dc927e9313421d1c788849b7fc7b5a4294fe803dbb0eaf9fd36  index.html" | sha256sum -c -

      - name: Verify JavaScript syntax and pinned MaleCNS mirror
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/models.js
          node --check src/body.js
          node --check src/grooming.js
          node --check src/leg-ik.js
          node --check src/corner.js
          node --check src/footholds.js
          test -s data/malecns/graph.flyg
          test -s data/malecns/neurons.flyn
          test -s data/malecns/meta.json
          test -s data/malecns/bodymap.json
          grep -Fq "const DEFAULT_BASE='../../data/malecns/';" src/malecns/worker.js

      - name: Run full test suite
        run: npm test

      - name: Clean staging and commit verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_v131
          rm -f .github/workflows/apply-v1.3.1.yml .github/workflows/assemble-v1.3.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: FlyLab v1.3.1 biomechanics and eye-safe grooming"
          git push
